name: Slack PR Notify

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: slackapi/slack-github-action@v2.1.1
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_PR }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ${{ toJson(format('New PR by {0}: {1}', github.event.pull_request.user.login, github.event.pull_request.title)) }},
              "blocks": [
                {
                  "type": "header",
                  "text": { "type": "plain_text", "text": "🔀 New Pull Request", "emoji": true }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": ${{ toJson(format('*<{0}|{1}>*', github.event.pull_request.html_url, github.event.pull_request.title)) }} }
                },
                {
                  "type": "context",
                  "elements": [
                    { "type": "mrkdwn", "text": ${{ toJson(format('👤 opened by *{0}*', github.event.pull_request.user.login)) }} }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": ${{ toJson(format('📁 `{0}`   🌿 `{1}` → `{2}`', github.repository, github.event.pull_request.head.ref, github.event.pull_request.base.ref)) }}
                    }
                  ]
                }
              ]
            }
