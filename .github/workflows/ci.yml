name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm run test:ci

      - run: npm run build

  slack-notify:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: slackapi/slack-github-action@v2.1.1
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ACTIONS }}
          webhook-type: incoming-webhook
          payload: |
            {
              "username": "CI Bot",
              "icon_emoji": ":gear:",
              "text": ${{ toJson(format('CI {0} on {1}', needs.build.result, github.ref_name)) }},
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ${{ toJson(format('{0} CI {1}', needs.build.result == 'success' && '✅' || '❌', needs.build.result)) }},
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": ${{ toJson(format('*Branch:* `{0}`', github.ref_name)) }} }
                },
                {
                  "type": "section",
                  "text": { "type": "mrkdwn", "text": ${{ toJson(format('*Commit:* {0}', github.event.head_commit.message || github.event.pull_request.title)) }} }
                },
                {
                  "type": "context",
                  "elements": [
                    { "type": "mrkdwn", "text": ${{ toJson(format('<{0}/{1}/actions/runs/{2}|View run ↗>', github.server_url, github.repository, github.run_id)) }} }
                  ]
                }
              ]
            }
