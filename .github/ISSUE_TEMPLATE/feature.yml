name: Feature
description: A feature or piece of work tracked against a PRD.
labels: ["feature"]
body:
  - type: input
    id: prd
    attributes:
      label: PRD
      description: Path to the PRD this issue implements, e.g. docs/prds/001-photo-upload.md
      placeholder: docs/prds/NNN-title.md
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is this issue about?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know this is done?
      value: |
        - [ ]
    validations:
      required: false
